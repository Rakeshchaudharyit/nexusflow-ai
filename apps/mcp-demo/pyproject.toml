[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusflow-mcp-demo"
version = "0.4.0"
description = "Demonstration MCP server for NexusFlow (synthetic data, no side effects)"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.10"]

[tool.setuptools.packages.find]
include = ["nexusflow_mcp_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
