[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusflow-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.142.2", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.3", "psycopg[binary]==3.3.6", "alembic==1.20.0", "pydantic-settings==2.15.0", "redis==6.4.0", "argon2-cffi==25.1.0", "PyJWT==2.15.1", "email-validator==2.3.0", "langgraph==1.2.14", "mcp==2.3.0", "jsonschema==4.26.0", "dramatiq[redis]==2.2.1", "python-multipart==0.0.32", "pypdf==6.19.0", "python-docx==1.2.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx2==2.13.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# LangSmith arrives transitively through langchain-core; keep tests offline and plugin-free.
addopts = "-p no:langsmith"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
